<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS & JS Animations Demo</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <h1>Animation Playground</h1>

      <div class="preferences">
        <h2>User Preferences</h2>
        <div class="pref-form">
          <label for="username">Username:</label>
          <input type="text" id="username" />

          <label for="theme">Theme:</label>
          <select id="theme">
            <option value="light">Light</option>
            <option value="dark">Dark</option>
            <option value="blue">Blue</option>
          </select>

          <label for="animation-speed">Animation Speed:</label>
          <select id="animation-speed">
            <option value="slow">Slow</option>
            <option value="normal">Normal</option>
            <option value="fast">Fast</option>
          </select>

          <button id="save-prefs">Save Preferences</button>
        </div>
      </div>

      <div class="animation-area">
        <h2>Animation Demo</h2>
        <div class="animated-box" id="animated-box"></div>
        <button id="animate-btn">Trigger Animation</button>
        <button id="reset-btn">Reset Animation</button>
      </div>

      <div class="transition-demo">
        <h2>Transition Demo</h2>
        <button class="transition-btn">Hover Me!</button>
        <div class="transition-box"></div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
